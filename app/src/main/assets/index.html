<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#081d19">
<title>نور الہدیٰ</title>
<style>
:root{--bg:#071914;--panel:#102b23;--panel2:#17392e;--gold:#d9b66c;--cream:#f5efdf;--muted:#b9c5b8;--line:#345448;--green:#244d3e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#163b2d 0,#071914 58%);color:var(--cream);font-family:"Noto Naskh Arabic","Noto Sans Arabic",serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.splash{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 35%,#245640,#061710 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}.splash .mark{width:112px;height:112px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:54px;color:var(--gold);box-shadow:0 0 45px #d9b66c22}.splash h1{font-size:34px;color:var(--gold);margin:20px 0 4px}.splash p{color:#d8d2bd;margin:0}.top{padding:24px 20px 18px;text-align:center;border-bottom:1px solid #d9b66c30;background:linear-gradient(180deg,#153b2d99,transparent)}.top .brand{font-size:29px;color:var(--gold);font-weight:bold}.top small{display:block;color:var(--muted);font-family:Arial,sans-serif;letter-spacing:2px;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:14px 14px 100px}.hero{border:1px solid #b9914b66;border-radius:22px;padding:22px;background:linear-gradient(135deg,#1a4937,#0d281f 75%);text-align:center;box-shadow:0 14px 36px #0003}.hero .bism{font-size:27px;color:#f0d99e;line-height:2}.hero p{margin:8px 0 0;color:#d9d6c8}.date{font:12px Arial;color:#c8b98e;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px}.tile{background:linear-gradient(145deg,#173b2f,#0e261f);border:1px solid var(--line);border-radius:17px;padding:17px 12px;text-align:center;color:var(--cream);min-height:112px}.tile .ico{font-size:26px;color:var(--gold)}.tile b{display:block;font-size:17px;margin-top:7px}.tile small{color:var(--muted)}.section{background:#0f2a22;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.section h2{margin:0 0 12px;color:var(--gold);font-size:22px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.field{width:100%;background:#f4efdf;color:#14271e;border:0;border-radius:11px;padding:12px;margin:5px 0}.btn{border:1px solid #c5a25d;background:#234b3a;color:#fff2d6;border-radius:12px;padding:11px 15px}.btn.primary{background:var(--gold);color:#14271e;font-weight:bold}.btn.ghost{background:transparent}.listitem{padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}.listitem:last-child{border:0}.listitem b{color:#f0d99e}.muted{color:var(--muted)}.arabic{font-size:27px;line-height:2.05;text-align:center;color:#f4dfaa;direction:rtl}.translation{font-size:18px;line-height:1.9;color:#e5e1d4}.meta{font:12px Arial;color:#b7c4b8;margin-top:7px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#091e18f5;border-top:1px solid #456052;display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:none;border:0;color:#d4c9a9;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom span{font-size:20px}.bottom button.active{color:var(--gold)}.back{margin-bottom:10px}.counter{font-size:68px;text-align:center;color:var(--gold);padding:20px}.counterbtn{width:160px;height:160px;border-radius:50%;font-size:25px;border:5px solid #d9b66c;background:linear-gradient(145deg,#285a43,#10291f);color:#f5e7c5;display:block;margin:0 auto}.center{text-align:center}.surahhead{text-align:center;color:var(--gold);padding:14px}.ayah{padding:16px 6px;border-bottom:1px solid var(--line)}.ayahnum{display:inline-grid;place-items:center;border:1px solid #c4a15c;border-radius:50%;width:27px;height:27px;color:var(--gold);font:12px Arial}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:6px 11px;color:#dfc98f;margin:3px;font-size:13px}.hidden{display:none!important}.sitefooter{text-align:center;padding:18px 10px 105px;color:#d9b66c;border-top:1px solid #d9b66c44;font-size:17px;line-height:1.9}.sitefooter .latin{font:10px Arial;letter-spacing:1px;color:#b9c5b8;margin-top:3px}.langcard{margin:18px 0;padding:22px;border:1px solid var(--gold);border-radius:20px;background:#102b23;text-align:center}.langcard button{width:100%;margin:8px 0;padding:18px;font-size:19px}.quranfont{font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif}.font-amiri{font-family:"Amiri","Noto Naskh Arabic",serif}.font-scheherazade{font-family:"Scheherazade New","Noto Naskh Arabic",serif}
</style></head><body>
<div id="splash" class="splash"><div class="mark">۞</div><h1>نور الہدیٰ</h1><p>قرآن • حدیث • دعائیں</p></div>
<header class="top"><div class="brand">نور الہدیٰ</div><small>NOOR UL HUDA</small></header><main id="app" class="wrap"></main>
<footer class="sitefooter"><div>صدقۂ جاریہ</div><div>محمد عمر بن سلیم کی طرف سے</div><div class="latin">SADQA JARIYA FROM MUHAMMAD OMER BIN SALEEM</div></footer>
<nav class="bottom" id="nav"><button data-page="home" class="active"><span>⌂</span>ہوم</button><button data-page="quran"><span>۞</span>قرآن</button><button data-page="hadith"><span>✧</span>حدیث</button><button data-page="dua"><span>🤲</span>دعائیں</button><button data-page="tools"><span>◉</span>اذکار</button></nav>
<script>
const app=document.getElementById('app');let current='home',surahs=[],tas=0,hadithPage=1,hadithBook='bukhari';
const duas=[
['سونے سے پہلے','بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا','اے اللہ! تیرے نام کے ساتھ میں مرتا اور جیتا ہوں۔','صحیح بخاری 6324'],
['جاگنے کے بعد','الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ','تمام تعریف اللہ کے لیے ہے جس نے ہمیں موت کے بعد زندگی دی اور اسی کی طرف اٹھ کر جانا ہے۔','صحیح بخاری 6312'],
['کھانا شروع کرنے سے پہلے','بِسْمِ اللَّهِ','اللہ کے نام سے شروع کرتا ہوں۔','صحیح بخاری 5376'],
['کھانے کے بعد','الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ','تمام تعریف اللہ کے لیے جس نے مجھے یہ کھلایا اور میری طاقت کے بغیر رزق دیا۔','ترمذی 3458'],
['گھر سے نکلتے وقت','بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','اللہ کے نام سے، میں نے اللہ پر بھروسہ کیا، نیکی کی طاقت اور برائی سے بچنے کی قوت اللہ ہی سے ہے۔','ابو داؤد 5095'],
['گھر میں داخل ہوتے وقت','بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا','اللہ کے نام سے ہم داخل ہوئے، اللہ کے نام سے نکلے اور اپنے رب پر بھروسہ کیا۔','ابو داؤد 5096'],
['مسجد میں داخل ہوتے وقت','اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ','اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔','صحیح مسلم 713'],
['مسجد سے نکلتے وقت','اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ','اے اللہ! میں تجھ سے تیرا فضل مانگتا ہوں۔','صحیح مسلم 713'],
['والدین کے لیے','رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا','اے میرے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں مجھے پالا۔','سورۃ الاسراء 17:24'],
['علم میں اضافے کے لیے','رَبِّ زِدْنِي عِلْمًا','اے میرے رب! میرے علم میں اضافہ فرما۔','سورۃ طٰہٰ 20:114'],
['دنیا و آخرت کی بھلائی','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','اے ہمارے رب! ہمیں دنیا اور آخرت میں بھلائی عطا فرما اور آگ کے عذاب سے بچا۔','سورۃ البقرۃ 2:201'],
['پریشانی کے وقت','حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ','ہمیں اللہ کافی ہے اور وہ بہترین کارساز ہے۔','سورۃ آل عمران 3:173'],
['استغفار','أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ','میں اللہ سے بخشش مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔','صحیح بخاری 6307'],
['درود شریف','اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ','اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما۔','صحیح بخاری 3370'],
['سفر کی دعا','سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ','پاک ہے وہ ذات جس نے اسے ہمارے تابع کیا، ورنہ ہم اسے قابو میں نہ کر سکتے تھے۔','سورۃ الزخرف 43:13'],
['بارش کے وقت','اللَّهُمَّ صَيِّبًا نَافِعًا','اے اللہ! اسے نفع دینے والی بارش بنا۔','صحیح بخاری 1032'],
['چھینک کے بعد','الْحَمْدُ لِلَّهِ','تمام تعریف اللہ کے لیے ہے۔','صحیح بخاری 6224'],
['غصے کے وقت','أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ','میں شیطان مردود سے اللہ کی پناہ مانگتا ہوں۔','صحیح بخاری 3282'],
['مصیبت کے وقت','إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ','ہم اللہ ہی کے ہیں اور اسی کی طرف لوٹ کر جانے والے ہیں۔','سورۃ البقرۃ 2:156'],
['افطار کے وقت','ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ','پیاس بجھ گئی، رگیں تر ہوگئیں اور ان شاء اللہ اجر ثابت ہوگیا۔','ابو داؤد 2357']
];
function go(p){current=p;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function home(){if(language==='en')return `<section class="hero"><div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><p>In the name of Allah, the Most Compassionate, the Most Merciful</p><div class="date">Hearts find peace in the remembrance of Allah</div></section><section class="section"><h2>Peace be upon you</h2><p class="translation">Welcome to Noor Ul Huda. The Holy Quran, selected Hadith, daily duas and useful worship tools in one place.</p><div class="row"><input class="field" id="username" placeholder="Enter your name" maxlength="32"><button class="btn" onclick="saveName()">Save</button></div><small class="muted" id="greet"></small></section><div class="grid"><button class="tile" onclick="go('quran')"><div class="ico">۞</div><b>The Holy Quran</b><small>114 Surahs, translation</small></button><button class="tile" onclick="go('hadith')"><div class="ico">✧</div><b>Prophetic Hadith</b><small>Selected narrations</small></button><button class="tile" onclick="go('dua')"><div class="ico">🤲</div><b>Daily Duas</b><small>Supplications</small></button><button class="tile" onclick="go('tools')"><div class="ico">◉</div><b>Dhikr & Tools</b><small>Tasbeeh and prayer times</small></button></div><section class="section"><h2>Reminder</h2><div class="arabic">فَاذْكُرُونِي أَذْكُرْكُمْ</div><p class="translation center">So remember Me; I will remember you.</p><div class="meta center">Surah Al-Baqarah 2:152</div></section>`;return `<section class="hero"><div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><p>اللہ کے نام سے جو نہایت مہربان، رحم فرمانے والا ہے</p><div class="date" id="hijri">اللہ کے ذکر سے دلوں کو سکون ملتا ہے</div></section><section class="section"><h2>السلام علیکم ورحمة اللہ</h2><p class="translation">نور الہدیٰ میں خوش آمدید۔ قرآنِ کریم، مستند احادیث، روزمرہ مسنون دعائیں اور عبادت کے مفید ٹولز ایک جگہ۔</p><div class="row"><input class="field" id="username" placeholder="اپنا نام لکھیں" maxlength="32"><button class="btn" onclick="saveName()">محفوظ</button></div><small class="muted" id="greet"></small></section><div class="grid"><button class="tile" onclick="go('quran')"><div class="ico">۞</div><b>قرآنِ کریم</b><small>114 سورتیں، ترجمہ</small></button><button class="tile" onclick="go('hadith')"><div class="ico">✧</div><b>احادیثِ نبوی ﷺ</b><small>حدیث کی کتب</small></button><button class="tile" onclick="go('dua')"><div class="ico">🤲</div><b>مسنون دعائیں</b><small>روزمرہ کی دعائیں</small></button><button class="tile" onclick="go('tools')"><div class="ico">◉</div><b>اذکار و ٹولز</b><small>تسبیح، نماز کے اوقات</small></button></div><section class="section"><h2>آج کی یاد دہانی</h2><div class="arabic">فَاذْكُرُونِي أَذْكُرْكُمْ</div><p class="translation center">پس تم مجھے یاد کرو، میں تمہیں یاد کروں گا۔</p><div class="meta center">سورۃ البقرۃ 2:152</div></section>`}
function render(){if(current==='home'){app.innerHTML=home();let n=localStorage.getItem('noorName');if(n){document.getElementById('greet').textContent='خوش آمدید، '+n;document.getElementById('username').value=n}return}if(current==='quran'){quranPage();return}if(current==='hadith'){hadithPageView();return}if(current==='dua'){app.innerHTML=language==='en'?'<section class="section"><h2>Daily Duas</h2><p class="muted">Arabic text, English translation and reference</p><input class="field" id="duasearch" placeholder="Search duas"><div id="dualist"></div></section>':'<section class="section"><h2>مسنون دعائیں</h2><p class="muted">عربی متن، اردو ترجمہ اور حوالہ</p><input class="field" id="duasearch" placeholder="دعا تلاش کریں"><div id="dualist"></div></section>';drawDuas();document.getElementById('duasearch').oninput=drawDuas;return}if(current==='tools'){toolsPage();return}}
function saveName(){let n=document.getElementById('username').value.trim();if(n){localStorage.setItem('noorName',n);document.getElementById('greet').textContent='خوش آمدید، '+n}}
async function quranPage(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'The Holy Quran':'قرآنِ کریم')+'</h2><p class="muted">'+(en?'114 Surahs • Arabic text • English translation':'114 سورتیں • عربی متن • اردو ترجمہ')+'</p><label class="muted">'+(en?'Arabic script font':'عربی خط منتخب کریں')+'</label><select class="field" id="qfont" onchange="setQuranFont(this.value)"><option value="naskh">Noto Naskh Arabic</option><option value="amiri">Amiri</option><option value="scheherazade">Scheherazade New</option></select><input class="field" id="surahsearch" placeholder="'+(en?'Search Surah name or number':'سورت کا نام یا نمبر تلاش کریں')+'"><div id="surahlist">'+(en?'Loading Surahs…':'فہرست لوڈ ہو رہی ہے…')+'</div></section>';try{let r=await fetch('https://api.alquran.cloud/v1/surah');let d=await r.json();surahs=d.data;drawSurahs();document.getElementById('surahsearch').oninput=drawSurahs}catch(e){document.getElementById('surahlist').textContent=en?'Could not load Quran list. Check internet.':'قرآن کی فہرست لوڈ نہ ہو سکی۔ انٹرنیٹ چیک کریں۔'}} 
function setQuranFont(v){document.querySelectorAll('.arabic').forEach(x=>x.classList.remove('font-amiri','font-scheherazade'));if(v==='amiri')document.querySelectorAll('.arabic').forEach(x=>x.classList.add('font-amiri'));if(v==='scheherazade')document.querySelectorAll('.arabic').forEach(x=>x.classList.add('font-scheherazade'))}
function drawSurahs(){let q=(document.getElementById('surahsearch')?.value||'').toLowerCase();document.getElementById('surahlist').innerHTML=surahs.filter(s=>(s.number+' '+s.name+' '+s.englishName).toLowerCase().includes(q)).map(s=>`<div class="listitem" onclick="readSurah(${s.number})"><b>${s.number}. ${s.name}</b><div class="meta">${s.englishName} • ${s.numberOfAyahs} آیات • ${s.revelationType==='Meccan'?'مکی':'مدنی'}</div></div>`).join('')}
async function readSurah(n){let en=language==='en';app.innerHTML='<section class="section"><button class="btn back" onclick="go(\'quran\')">'+(en?'← Surah list':'← فہرست')+'</button><div class="center muted">'+(en?'Loading verses…':'آیات لوڈ ہو رہی ہیں…')+'</div></section>';try{let edition=en?'en.sahih':'ur.jalandhry';let r=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/editions/quran-uthmani,'+edition);let d=await r.json(),ar=d.data[0],ur=d.data[1];let bism=(n!==1&&n!==9)?'<div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'';app.innerHTML='<section class="section"><button class="btn back" onclick="go(\'quran\')">← تمام سورتیں</button><div class="surahhead"><h2>'+ar.name+'</h2><div class="meta">'+ar.englishName+' • '+ar.numberOfAyahs+' آیات • '+(ar.revelationType==='Meccan'?'مکی':'مدنی')+'</div></div>'+bism+'<div class="meta center">بسم اللہ سورۃ الفاتحہ کی پہلی آیت کا حصہ ہے؛ سورۃ التوبہ سے پہلے نہیں آتی۔</div>'+ar.ayahs.map((a,i)=>'<div class="ayah"><div class="arabic">'+a.text+' <span class="ayahnum">'+a.numberInSurah+'</span></div><div class="translation">'+ur.ayahs[i].text+'</div></div>').join('')+'</section>'}catch(e){app.innerHTML='<section class="section">آیات لوڈ نہیں ہو سکیں۔ انٹرنیٹ چیک کریں۔</section>'}}
const localHadiths=[

function hadithPageView(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'Prophetic Hadith':'احادیثِ نبوی ﷺ')+'</h2><p class="muted">'+(en?'Selected narrations • Arabic • English translation • reference':'منتخب احادیث • عربی متن • اردو ترجمہ • حوالہ')+'</p><select class="field" id="book"><option value="all">تمام منتخب احادیث</option><option value="bukhari">صحیح بخاری</option><option value="muslim">صحیح مسلم</option></select><div id="hadithlist"></div><p class="meta">یہ منتخب احادیث ایپ میں محفوظ ہیں، ان کے لیے انٹرنیٹ یا بیرونی سرور کی ضرورت نہیں۔</p></section>';document.getElementById('book').onchange=drawHadith;drawHadith()}
function drawHadith(){let book=document.getElementById('book')?.value||'all';let arr=localHadiths.filter(h=>book==='all'||h.book===book);document.getElementById('hadithlist').innerHTML=arr.map(h=>'<div class="ayah"><div class="arabic">'+h.arab+'</div><p class="translation">'+(language==='en'?h.english:h.urdu)+'</p><div class="meta">'+(language==='en'?h.bookEn+' • Hadith No: ':'حدیث نمبر: ')+h.number+'</div></div>').join('')}
duas.forEach((d,i)=>d[4]=["In Your name, O Allah, I die and I live.","All praise is for Allah who gave us life after causing us to die, and to Him is the resurrection.","In the name of Allah.","All praise is for Allah who fed me this and provided it for me without any power or strength from me.","In the name of Allah; I place my trust in Allah. There is no might nor power except with Allah.","In the name of Allah we enter, and in the name of Allah we leave, and upon our Lord we rely.","O Allah, open for me the gates of Your mercy.","O Allah, I ask You for Your bounty.","My Lord, have mercy upon them as they raised me when I was small.","My Lord, increase me in knowledge.","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","Allah is sufficient for us, and He is the best disposer of affairs.","I seek forgiveness from Allah and repent to Him.","O Allah, send blessings upon Muhammad and the family of Muhammad.","Glory be to the One who has subjected this to us, and we could not have done so by ourselves.","O Allah, make it a beneficial rain.","All praise is for Allah.","I seek refuge in Allah from Satan, the accursed.","Indeed, we belong to Allah, and indeed, to Him we will return.","The thirst has gone, the veins are moistened, and the reward is confirmed, if Allah wills."][i]);
function drawDuas(){let q=(document.getElementById('duasearch')?.value||'').toLowerCase();document.getElementById('dualist').innerHTML=duas.filter(d=>d.join(' ').toLowerCase().includes(q)).map(d=>'<div class="ayah"><b>'+d[0]+'</b><div class="arabic">'+d[1]+'</div><p class="translation">'+(language==='en'?d[4]||d[2]:d[2])+'</p><div class="meta">'+d[3]+'</div></div>').join('')}
const dhikrs=[{name:'أَسْتَغْفِرُ اللّٰهَ',urdu:'استغفراللہ',meaning:'میں اللہ سے بخشش مانگتا ہوں'},{name:'سُبْحَانَ اللّٰهِ',urdu:'سبحان اللہ',meaning:'اللہ پاک ہے'},{name:'الْحَمْدُ لِلّٰهِ',urdu:'الحمدللہ',meaning:'تمام تعریف اللہ کے لیے ہے'},{name:'اللّٰهُ أَكْبَرُ',urdu:'اللہ اکبر',meaning:'اللہ سب سے بڑا ہے'}];
let selectedDhikr=0,dhikrCounts=JSON.parse(localStorage.getItem('noorDhikrCounts')||'[0,0,0,0]');
function chooseDhikr(i){selectedDhikr=i;toolsPage()}
function incrementDhikr(){dhikrCounts[selectedDhikr]++;localStorage.setItem('noorDhikrCounts',JSON.stringify(dhikrCounts));document.getElementById('count').textContent=dhikrCounts[selectedDhikr];document.getElementById('allcounts').innerHTML=dhikrs.map((d,i)=>'<div class="listitem">'+d.urdu+' <b style="float:left;direction:ltr">'+dhikrCounts[i]+'</b></div>').join('')}
function toolsPage(){let en=language==='en';app.innerHTML=en?'<section class="section center"><h2>Digital Tasbeeh</h2><p class="muted">Choose your dhikr</p><div class="grid">'+dhikrs.map((d,i)=>'<button class="tile" style="'+(selectedDhikr===i?'border-color:var(--gold);background:#244b39':'')+'" onclick="chooseDhikr('+i+')"><b>'+['Astaghfirullah','Subhan Allah','Alhamdulillah','Allahu Akbar'][i]+'</b><small>'+d.name+'</small><div class="meta">Count: '+dhikrCounts[i]+'</div></button>').join('')+'</div><div class="counter" id="count">'+dhikrCounts[selectedDhikr]+'</div><div class="arabic">'+dhikrs[selectedDhikr].name+'</div><button class="counterbtn" onclick="incrementDhikr()">Count Dhikr</button><div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="if(confirm(\'Reset this count?\')){dhikrCounts[selectedDhikr]=0;localStorage.setItem(\'noorDhikrCounts\',JSON.stringify(dhikrCounts));toolsPage()}">Reset this dhikr</button></div><div class="section" id="allcounts"><h2>All Dhikr Counts</h2>'+dhikrs.map((d,i)=>'<div class="listitem">'+['Astaghfirullah','Subhan Allah','Alhamdulillah','Allahu Akbar'][i]+' <b style="float:left;direction:ltr">'+dhikrCounts[i]+'</b></div>').join('')+'</div></section><section class="section"><h2>Prayer Times</h2><input class="field" id="city" value="Jeddah" placeholder="City name"><button class="btn primary" onclick="prayerTimes()">Get prayer times</button><div id="prayers" class="translation" style="margin-top:12px">Enter a city to get prayer times.</div></section><section class="section"><h2>Qibla Direction</h2><p class="translation">Enter your latitude and longitude to calculate the Qibla direction.</p><input class="field" id="lat" type="number" step="any" placeholder="Latitude"><input class="field" id="lon" type="number" step="any" placeholder="Longitude"><button class="btn" onclick="qibla()">Find Qibla direction</button><div id="qiblaout" class="center" style="font-size:25px;color:var(--gold);padding:12px"></div></section>':'<section class="section center"><h2>ڈیجیٹل تسبیح</h2><p class="muted">اپنا ذکر منتخب کریں</p><div class="grid">'+dhikrs.map((d,i)=>'<button class="tile" style="'+(selectedDhikr===i?'border-color:var(--gold);background:#244b39':'')+'" onclick="chooseDhikr('+i+')"><b>'+d.urdu+'</b><small>'+d.meaning+'</small><div class="meta">گنتی: '+dhikrCounts[i]+'</div></button>').join('')+'</div><div class="counter" id="count">'+dhikrCounts[selectedDhikr]+'</div><div class="arabic">'+dhikrs[selectedDhikr].name+'</div><p class="muted">'+dhikrs[selectedDhikr].meaning+'</p><button class="counterbtn" onclick="incrementDhikr()">ذکر شمار کریں</button><div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="if(confirm(\'اس ذکر کی گنتی صفر کر دیں؟\')){dhikrCounts[selectedDhikr]=0;localStorage.setItem(\'noorDhikrCounts\',JSON.stringify(dhikrCounts));toolsPage()}">اس ذکر کو ری سیٹ کریں</button></div><div class="section" id="allcounts"><h2>تمام اذکار کی گنتی</h2>'+dhikrs.map((d,i)=>'<div class="listitem">'+d.urdu+' <b style="float:left;direction:ltr">'+dhikrCounts[i]+'</b></div>').join('')+'</div></section><section class="section"><h2>نماز کے اوقات</h2><input class="field" id="city" value="Jeddah" placeholder="شہر کا نام"><button class="btn primary" onclick="prayerTimes()">اوقات معلوم کریں</button><div id="prayers" class="translation" style="margin-top:12px">شہر منتخب کرکے نماز کے اوقات حاصل کریں۔</div></section><section class="section"><h2>قبلہ کی سمت</h2><p class="translation">قبلہ کا رخ معلوم کرنے کے لیے عرض البلد اور طول البلد درج کریں۔</p><input class="field" id="lat" type="number" step="any" placeholder="Latitude"><input class="field" id="lon" type="number" step="any" placeholder="Longitude"><button class="btn" onclick="qibla()">قبلہ معلوم کریں</button><div id="qiblaout" class="center" style="font-size:25px;color:var(--gold);padding:12px"></div></section>'}
async function prayerTimes(){let city=document.getElementById('city').value.trim()||'Jeddah',box=document.getElementById('prayers');box.textContent='اوقات حاصل ہو رہے ہیں…';try{let r=await fetch('https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(city)+'&country=Saudi%20Arabia&method=4');let d=(await r.json()).data.timings;box.innerHTML=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map((k,i)=>'<div class="listitem">'+(language==='en'?['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'][i]:['فجر','طلوع آفتاب','ظہر','عصر','مغرب','عشاء'][i])+' <b style="float:left;direction:ltr">'+d[k]+'</b></div>').join('')}catch(e){box.textContent='نماز کے اوقات حاصل نہیں ہو سکے۔'}}
function qibla(){let lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){document.getElementById('qiblaout').textContent='درست نقاط درج کریں';return}let r=Math.PI/180,p1=lat*r,p2=21.4225*r,dl=(39.8262-lon)*r,y=Math.sin(dl),x=Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl),deg=(Math.atan2(y,x)/r+360)%360;document.getElementById('qiblaout').textContent=language==='en'?'Qibla: '+deg.toFixed(1)+'° clockwise from North':'قبلہ: '+deg.toFixed(1)+'° شمال سے گھڑی کی سمت'}
let language='ur';
function chooseLanguage(code){language=code;document.documentElement.lang=code;document.documentElement.dir=code==='ur'?'rtl':'ltr';document.getElementById('nav').style.display='flex';document.getElementById('nav').innerHTML=code==='ur'?'<button data-page="home" class="active"><span>⌂</span>ہوم</button><button data-page="quran"><span>۞</span>قرآن</button><button data-page="hadith"><span>✧</span>حدیث</button><button data-page="dua"><span>🤲</span>دعائیں</button><button data-page="tools"><span>◉</span>اذکار</button>':'<button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="quran"><span>۞</span>Quran</button><button data-page="hadith"><span>✧</span>Hadith</button><button data-page="dua"><span>🤲</span>Duas</button><button data-page="tools"><span>◉</span>Dhikr</button>';document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home')}
function languagePage(){document.getElementById('nav').style.display='none';app.innerHTML='<section class="langcard"><div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><h2 style="color:var(--gold)">Choose Your Language / زبان منتخب کریں</h2><p class="muted">Select the translation language for Quran, Hadith and Duas</p><button class="btn primary" onclick="chooseLanguage(\'ur\')">العربية + اردو</button><button class="btn primary" onclick="chooseLanguage(\'en\')">English + العربية</button></section>'}
setTimeout(()=>{let splash=document.getElementById('splash');splash.style.opacity='0';setTimeout(()=>{splash.remove();languagePage()},550)},1700);
</script></body></html>
