let mushafPage=1,mushafFontSize=25,mushafCurrentSurah=1;
async function readMushafSurah(n){
  mushafCurrentSurah=n;
  app.innerHTML='<section class="mushaf-shell"><div class="mushaf-toolbar"><button class="btn" onclick="quranPage()">← فہرست</button><span class="mushaf-label">قرآن مجید • کتابی مطالعہ</span><button class="btn" onclick="changeMushafZoom(2)">A+</button><button class="btn" onclick="changeMushafZoom(-2)">A−</button></div><div id="mushafLoading" class="mushaf-loading">قرآنِ کریم لوڈ ہو رہا ہے…</div><div id="mushafBook" class="mushaf-page hidden"></div><div class="mushaf-pagination"><button class="btn" onclick="moveMushafPage(-1)">صفحہ سابق</button><label id="mushafPageLabel">صفحہ 1 / 604</label><button class="btn" onclick="moveMushafPage(1)">اگلا صفحہ</button></div><div class="mushaf-jump"><input id="mushafJumpInput" type="number" min="1" max="604" class="field" placeholder="صفحہ نمبر 1–604"><button class="btn primary" onclick="jumpMushafPage()">جائیں</button></div><p class="mushaf-credit">عربی متن: Quran Uthmani • صفحہ بندی: مدینہ مصحف</p></section>';
  try{
    const sr=await fetch('https://api.alquran.cloud/v1/surah/'+n);
    const sd=await sr.json();
    if(sd.code!==200||!sd.data?.ayahs?.length)throw Error('surah');
    mushafPage=sd.data.ayahs[0].page||1;
    await loadMushafPage(mushafPage);
  }catch(e){
    const l=document.getElementById('mushafLoading');
    if(l)l.textContent='قرآن لوڈ نہیں ہو سکا۔ انٹرنیٹ چیک کرکے دوبارہ کوشش کریں۔';
  }
}
async function loadMushafPage(page){
  page=Math.max(1,Math.min(604,Number(page)||1));mushafPage=page;
  const book=document.getElementById('mushafBook'),loading=document.getElementById('mushafLoading');
  if(book)book.classList.add('hidden');if(loading){loading.classList.remove('hidden');loading.textContent='صفحہ '+page+' لوڈ ہو رہا ہے…'}
  try{
    const r=await fetch('https://api.alquran.cloud/v1/page/'+page+'/quran-uthmani');
    const j=await r.json();if(j.code!==200||!j.data?.ayahs?.length)throw Error('page');
    const ayahs=j.data.ayahs;let html='';
    ayahs.forEach((a,i)=>{
      if(i===0||a.numberInSurah===1){
        html+='<div class="mushaf-surah-name">'+a.surah.name+'</div>';
        if(a.numberInSurah===1&&a.surah.number!==1&&a.surah.number!==9)html+='<div class="mushaf-bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';
      }
      html+='<span class="mushaf-verse">'+a.text+' <span class="mushaf-ayah-mark">۞'+a.numberInSurah+'۞</span> </span>';
    });
    if(book){book.innerHTML='<div class="mushaf-inner" style="--mushaf-font:'+mushafFontSize+'px">'+html+'</div>';book.classList.remove('hidden')}
    if(loading)loading.classList.add('hidden');
    const label=document.getElementById('mushafPageLabel');if(label)label.textContent='صفحہ '+page+' / 604';
    const input=document.getElementById('mushafJumpInput');if(input)input.value=page;
    const prev=document.querySelector('.mushaf-pagination button:first-child'),next=document.querySelector('.mushaf-pagination button:last-child');
    if(prev)prev.disabled=page===1;if(next)next.disabled=page===604;
  }catch(e){if(loading){loading.classList.remove('hidden');loading.textContent='یہ صفحہ لوڈ نہیں ہو سکا۔ دوبارہ کوشش کریں۔'}}
}
function moveMushafPage(step){loadMushafPage(mushafPage+step)}
function jumpMushafPage(){const v=Number(document.getElementById('mushafJumpInput')?.value);if(Number.isInteger(v)&&v>=1&&v<=604)loadMushafPage(v);else alert('صفحہ نمبر 1 سے 604 کے درمیان درج کریں۔')}
function changeMushafZoom(delta){mushafFontSize=Math.max(18,Math.min(40,mushafFontSize+delta));const inner=document.querySelector('.mushaf-inner');if(inner)inner.style.setProperty('--mushaf-font',mushafFontSize+'px')}


let audioPlayerReady=false;
let audioDbPromise=null;
function openAudioDb(){if(audioDbPromise)return audioDbPromise;audioDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('NoorHudaAudio',1);req.onupgradeneeded=()=>req.result.createObjectStore('surahs');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return audioDbPromise}
async function getOfflineSurah(n){try{const db=await openAudioDb();return await new Promise((resolve,reject)=>{const r=db.transaction('surahs').objectStore('surahs').get(n);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}}
async function saveOfflineSurah(n,blob){const db=await openAudioDb();return new Promise((resolve,reject)=>{const tx=db.transaction('surahs','readwrite');tx.objectStore('surahs').put(blob,n);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function ensureAudioPlayer(){if(audioPlayerReady)return;audioPlayerReady=true;const box=document.createElement('section');box.id='persistentAudioPlayer';box.className='persistent-audio hidden';box.innerHTML='<div class="persistent-audio-top"><div class="persistent-audio-art">♫</div><div class="persistent-audio-info"><b id="persistentAudioTitle">Quran Recitation</b><small id="persistentAudioDetails">Mishary Rashid Alafasy • Full Surah</small><small id="persistentAudioStatus">Choose a Surah to begin</small></div><button class="persistent-close" onclick="stopQuranAudio()">✕</button></div><audio id="persistentQuranAudio" preload="none"></audio><div class="persistent-audio-controls"><button onclick="audioPrev()" aria-label="Previous Surah">⏮</button><button id="persistentPlayPause" class="persistent-play" onclick="toggleQuranAudio()">▶</button><button onclick="audioNext()" aria-label="Next Surah">⏭</button><button id="persistentDownload" onclick="downloadCurrentSurah()">⬇</button></div><div class="persistent-audio-foot">You can download this Surah when internet is available.</div>';document.body.appendChild(box);quranAudio=document.getElementById('persistentQuranAudio');quranAudio.onplay=()=>{document.getElementById('persistentPlayPause').textContent='Ⅱ';document.getElementById('persistentAudioStatus').textContent='Now playing'};quranAudio.onpause=()=>{document.getElementById('persistentPlayPause').textContent='▶'};quranAudio.onended=()=>{document.getElementById('persistentAudioStatus').textContent='Surah completed';if(audioSurah<114)audioNext()}}
async function audioQuranPage(){let en=language==='en';ensureAudioPlayer();app.innerHTML='<section class="section"><button class="btn back" onclick="quranPage()">← '+(en?'Quran options':'قرآن کے اختیارات')+'</button><h2>'+(en?'Audio Quran':'آڈیو قرآن')+'</h2><p class="muted">'+(en?'Mishary Rashid Alafasy • Surah-by-Surah recitation':'قاری مشاری راشد العفاسی • سورت وار تلاوت')+'</p><input class="field" id="audioSearch" placeholder="'+(en?'Search Surah':'سورت تلاش کریں')+'"><div id="audioSurahList" class="muted">فہرست لوڈ ہو رہی ہے…</div><p class="meta">Select any Surah. The player stays visible while you move between app pages.</p></section>';try{await loadSurahs();drawAudioSurahs();document.getElementById('audioSearch').oninput=drawAudioSurahs}catch(e){document.getElementById('audioSurahList').textContent='فہرست لوڈ نہیں ہو سکی۔'}}
function drawAudioSurahs(){let q=(document.getElementById('audioSearch')?.value||'').toLowerCase();let box=document.getElementById('audioSurahList');if(!box)return;box.innerHTML=surahs.filter(s=>(s.number+' '+s.name+' '+s.englishName).toLowerCase().includes(q)).map(s=>'<div class="listitem" onclick="playAudioSurah('+s.number+')"><b>'+s.number+'. '+s.name+'</b><div class="meta">'+s.englishName+' • '+s.numberOfAyahs+' آیات</div></div>').join('')}
function audioUrl(s){return 'https://server8.mp3quran.net/afs/'+String(s).padStart(3,'0')+'.mp3'}
async function playAudioSurah(n){ensureAudioPlayer();let s=surahs.find(x=>x.number===n);if(!s){await loadSurahs();s=surahs.find(x=>x.number===n)}if(!s)return;audioSurah=n;audioAyah=1;audioTotal=s.numberOfAyahs;const box=document.getElementById('persistentAudioPlayer');box.classList.remove('hidden');document.getElementById('persistentAudioTitle').textContent=s.name+' — '+s.englishName;document.getElementById('persistentAudioDetails').textContent='Surah '+s.number+' • '+s.numberOfAyahs+' Ayahs • Mishary Alafasy';document.getElementById('persistentAudioStatus').textContent='Checking downloaded audio…';const cached=await getOfflineSurah(n);if(cached){if(quranAudio.src.startsWith('blob:'))URL.revokeObjectURL(quranAudio.src);quranAudio.src=URL.createObjectURL(cached);document.getElementById('persistentAudioStatus').textContent='Downloaded • Offline ready'}else{quranAudio.src=audioUrl(n);document.getElementById('persistentAudioStatus').textContent='Streaming • Internet required'}quranAudio.load();quranAudio.play().catch(()=>{document.getElementById('persistentAudioStatus').textContent='Press Play to listen'})}
function toggleQuranAudio(){if(!quranAudio)return;if(quranAudio.paused)quranAudio.play().catch(()=>{});else quranAudio.pause()}
function stopQuranAudio(){if(quranAudio){quranAudio.pause();quranAudio.removeAttribute('src');quranAudio.load()}document.getElementById('persistentAudioPlayer')?.classList.add('hidden')}
async function downloadCurrentSurah(){if(!audioSurah)return;const b=document.getElementById('persistentDownload'),status=document.getElementById('persistentAudioStatus');b.textContent='…';status.textContent='Downloading Surah for offline listening…';try{const cached=await getOfflineSurah(audioSurah);if(cached){status.textContent='Already downloaded • Offline ready';b.textContent='✓';return}const r=await fetch(audioUrl(audioSurah));if(!r.ok)throw Error('download');const blob=await r.blob();await saveOfflineSurah(audioSurah,blob);if(quranAudio.src.startsWith('blob:'))URL.revokeObjectURL(quranAudio.src);quranAudio.src=URL.createObjectURL(blob);quranAudio.load();status.textContent='Downloaded • This Surah is ready offline';b.textContent='✓'}catch(e){status.textContent='Download failed. Please connect to the internet and try again.';b.textContent='⬇'}}
function audioNext(){if(audioSurah<114)playAudioSurah(audioSurah+1)}
function audioPrev(){if(audioSurah>1)playAudioSurah(audioSurah-1)}

async function togglePrayerAlerts(){let on=localStorage.getItem('noorPrayerAlerts')==='on';if(on){if(window.PrayerBridge)PrayerBridge.cancelPrayerNotifications();localStorage.setItem('noorPrayerAlerts','off');azanPage();return}try{let city=document.getElementById('city')?.value.trim()||'Jeddah';let url='https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(city)+'&country=Saudi%20Arabia&method=4';let res=await fetch(url),data=(await res.json()).data.timings;let names=language==='en'?['Fajr','Dhuhr','Asr','Maghrib','Isha']:['فجر','ظہر','عصر','مغرب','عشاء'];let keys=['Fajr','Dhuhr','Asr','Maghrib','Isha'];let times=keys.map((k,i)=>({name:names[i],time:data[k]}));if(!window.PrayerBridge){alert(language==='en'?'Prayer notifications are not supported in this app version.':'اس ایپ کے اس ورژن میں نوٹیفکیشن سپورٹ دستیاب نہیں۔');return}PrayerBridge.schedulePrayerNotifications(JSON.stringify(times));localStorage.setItem('noorPrayerAlerts','on');azanPage()}catch(e){alert(language==='en'?'Could not load prayer times. Check your internet connection.':'نماز کے اوقات حاصل نہیں ہوئے، انٹرنیٹ چیک کریں۔')}}
async function prayerTimes(){let city=document.getElementById('city').value.trim()||'Jeddah',box=document.getElementById('prayers');box.textContent='اوقات حاصل ہو رہے ہیں…';try{let r=await fetch('https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(city)+'&country=Saudi%20Arabia&method=4');let d=(await r.json()).data.timings;box.innerHTML=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map((k,i)=>'<div class="listitem">'+(language==='en'?['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'][i]:['فجر','طلوع آفتاب','ظہر','عصر','مغرب','عشاء'][i])+' <b style="float:left;direction:ltr">'+d[k]+'</b></div>').join('')}catch(e){box.textContent='نماز کے اوقات حاصل نہیں ہو سکے۔'}}
function qibla(){let lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){document.getElementById('qiblaout').textContent='درست نقاط درج کریں';return}let r=Math.PI/180,p1=lat*r,p2=21.4225*r,dl=(39.8262-lon)*r,y=Math.sin(dl),x=Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl),deg=(Math.atan2(y,x)/r+360)%360;document.getElementById('qiblaout').textContent=language==='en'?'Qibla: '+deg.toFixed(1)+'° clockwise from North':'قبلہ: '+deg.toFixed(1)+'° شمال سے گھڑی کی سمت'}
let language='ur';
function chooseLanguage(code){language=code;document.documentElement.lang=code;document.documentElement.dir=code==='ur'?'rtl':'ltr';document.getElementById('nav').style.display='flex';document.getElementById('nav').innerHTML=code==='ur'?'<button data-page="home" class="active"><span>⌂</span>ہوم</button><button data-page="quran"><span>۞</span>قرآن</button><button data-page="hadith"><span>✧</span>حدیث</button><button data-page="dua"><span>🤲</span>دعائیں</button><button data-page="tools"><span>◉</span>اذکار</button><button data-page="history"><span>⌁</span>تاریخ</button>':'<button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="quran"><span>۞</span>Quran</button><button data-page="hadith"><span>✧</span>Hadith</button><button data-page="dua"><span>🤲</span>Duas</button><button data-page="tools"><span>◉</span>Dhikr</button><button data-page="history"><span>⌁</span>History</button>';document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home')}
function languagePage(){document.getElementById('nav').style.display='none';app.innerHTML='<section class="langcard"><div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><h2 style="color:var(--gold)">Choose Your Language / زبان منتخب کریں</h2><p class="muted">Select the translation language for Quran, Hadith and Duas</p><button class="btn primary" onclick="chooseLanguage(\'ur\')">العربية + اردو</button><button class="btn primary" onclick="chooseLanguage(\'en\')">English + العربية</button></section>'}
setTimeout(()=>{let splash=document.getElementById('splash');splash.style.opacity='0';setTimeout(()=>{splash.remove();languagePage()},550)},1700);
</script></body></html>
