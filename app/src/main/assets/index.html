<style>
:root{--bg:#071914;--panel:#102b23;--panel2:#17392e;--gold:#d9b66c;--cream:#f5efdf;--muted:#b9c5b8;--line:#345448;--green:#244d3e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#163b2d 0,#071914 58%);color:var(--cream);font-family:Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.splash{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 35%,#245640,#061710 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}.splash .mark{width:112px;height:112px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:54px;color:var(--gold);box-shadow:0 0 45px #d9b66c22}.splash h1{font-size:34px;color:var(--gold);margin:20px 0 4px}.splash p{color:#d8d2bd;margin:0}.top{padding:24px 20px 18px;text-align:center;border-bottom:1px solid #d9b66c30;background:linear-gradient(180deg,#153b2d99,transparent)}.top .brand{font-size:29px;color:var(--gold);font-weight:bold}.top small{display:block;color:var(--muted);font-family:Arial,sans-serif;letter-spacing:2px;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:14px 14px 100px}.hero{border:1px solid #b9914b66;border-radius:22px;padding:22px;background:linear-gradient(135deg,#1a4937,#0d281f 75%);text-align:center;box-shadow:0 14px 36px #0003}.hero .bism{font-size:27px;color:#f0d99e;line-height:2}.hero p{margin:8px 0 0;color:#d9d6c8}.date{font:12px Arial;color:#c8b98e;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px}.tile{background:linear-gradient(145deg,#173b2f,#0e261f);border:1px solid var(--line);border-radius:17px;padding:17px 12px;text-align:center;color:var(--cream);min-height:112px}.tile .ico{font-size:26px;color:var(--gold)}.tile b{display:block;font-size:17px;margin-top:7px}.tile small{color:var(--muted)}.section{background:#0f2a22;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.section h2{margin:0 0 12px;color:var(--gold);font-size:22px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.field{width:100%;background:#f4efdf;color:#14271e;border:0;border-radius:11px;padding:12px;margin:5px 0}.btn{border:1px solid #c5a25d;background:#234b3a;color:#fff2d6;border-radius:12px;padding:11px 15px}.btn.primary{background:var(--gold);color:#14271e;font-weight:bold}.btn.ghost{background:transparent}.listitem{padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}.listitem:last-child{border:0}.listitem b{color:#f0d99e}.muted{color:var(--muted)}.arabic{font-family:serif;font-size:27px;line-height:2.05;text-align:center;color:#f4dfaa;direction:rtl}.translation{font-size:18px;line-height:1.9;color:#e5e1d4}.meta{font:12px Arial;color:#b7c4b8;margin-top:7px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#091e18f5;border-top:1px solid #456052;display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:none;border:0;color:#d4c9a9;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom span{font-size:20px}.bottom button.active{color:var(--gold)}.back{margin-bottom:10px}.counter{font-size:68px;text-align:center;color:var(--gold);padding:20px}.counterbtn{width:160px;height:160px;border-radius:50%;font-size:25px;border:5px solid #d9b66c;background:linear-gradient(145deg,#285a43,#10291f);color:#f5e7c5;display:block;margin:0 auto}.center{text-align:center}.surahhead{text-align:center;color:var(--gold);padding:14px}.ayah{padding:16px 6px;border-bottom:1px solid var(--line)}.ayahnum{display:inline-grid;place-items:center;border:1px solid #c4a15c;border-radius:50%;width:27px;height:27px;color:var(--gold);font:12px Arial}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:6px 11px;color:#dfc98f;margin:3px;font-size:13px}.hidden{display:none!important}.sitefooter{text-align:center;padding:18px 10px 105px;color:#d9b66c;border-top:1px solid #d9b66c44;font-size:17px;line-height:1.9}.sitefooter .latin{font:10px Arial;letter-spacing:1px;color:#b9c5b8;margin-top:3px}.langcard{margin:18px 0;padding:22px;border:1px solid var(--gold);border-radius:20px;background:#102b23;text-align:center}.langcard button{width:100%;margin:8px 0;padding:18px;font-size:19px}

/* Noor Ul Huda modern refresh */
:root{--bg:#061711;--panel:#102a21;--panel2:#183c2e;--gold:#e4c27a;--cream:#fff8e9;--muted:#bdcbbf;--line:#385b4b}
body{background:linear-gradient(160deg,#071b15 0%,#0b241b 48%,#06140f 100%);font-family:system-ui,Arial,sans-serif}
.top{padding:17px 18px 14px;background:#071b15dd;backdrop-filter:blur(16px);position:sticky;top:0;z-index:3;border-bottom:1px solid #d9b66c25}
.top .brand{font-size:25px;letter-spacing:.4px}.wrap{padding:14px 14px 110px}
.hero{border:1px solid #d9b66c55;border-radius:25px;background:linear-gradient(135deg,#194b37,#0b241b);box-shadow:0 16px 40px #0005;padding:23px 17px}
.section{background:linear-gradient(145deg,#122f25,#0b2119);border:1px solid #ffffff13;border-radius:21px;box-shadow:0 10px 25px #0002;padding:17px}
.tile{background:linear-gradient(145deg,#1b4433,#10271e);border:1px solid #d8bc7938;border-radius:20px;min-height:118px;box-shadow:0 7px 18px #0002;transition:transform .18s,border-color .18s}
.tile:active{transform:scale(.97)}.tile .ico{font-size:29px}.tile b{font-size:15px}
.bottom{background:#071811f2;backdrop-filter:blur(18px);border-top:1px solid #d9b66c35;padding-top:10px}
.bottom button{font-size:11px}.bottom span{font-size:21px}
.modern-places{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.place-card{height:154px;position:relative;overflow:hidden;border-radius:20px;border:1px solid #d9b66c55;background:#142c22}
.place-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.82;transition:transform .3s}
.place-card:active img{transform:scale(1.04)}
.place-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06150fe8,transparent 75%)}
.place-card b{position:absolute;z-index:1;bottom:12px;right:13px;left:10px;color:#fff4d8;font-size:16px;text-shadow:0 2px 8px #000}
.info-strip{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.info-chip{background:#17392c;border:1px solid #d9b66c35;border-radius:16px;padding:13px;min-height:80px}
.info-chip b{display:block;color:var(--gold);font-size:14px;margin-bottom:5px}
.info-chip span{font-size:13px;color:#f5f0e2}
.history-item{background:#163629;border:1px solid #d9b66c30;border-radius:15px;padding:14px;margin:9px 0}
.history-item b{color:var(--gold);font-size:17px}
.history-item p{line-height:1.85;margin:8px 0 0;color:#f1eadb}
.history-item .meta{margin-top:8px}
@media(min-width:600px){.modern-places .place-card{height:210px}.wrap{padding-top:22px}}
</style></head><body>
<div id="splash" class="splash"><div class="mark">۞</div><h1>نور الہدیٰ</h1><p>قرآن • حدیث • دعائیں</p></div>
<header class="top"><div class="brand">نور الہدیٰ</div><small>NOOR UL HUDA</small></header><main id="app" class="wrap"></main>
<footer class="sitefooter"><div>صدقۂ جاریہ</div><div>محمد عمر بن سلیم کی طرف سے</div><div class="latin">SADQA JARIYA FROM MUHAMMAD OMER BIN SALEEM</div></footer>
<nav class="bottom" id="nav"><button data-page="home" class="active"><span>⌂</span>ہوم</button><button data-page="quran"><span>۞</span>قرآن</button><button data-page="hadith"><span>✧</span>حدیث</button><button data-page="dua"><span>🤲</span>دعائیں</button><button data-page="tools"><span>◉</span>اذکار</button><button data-page="history"><span>⌁</span>تاریخ</button></nav>
<script>
const app=document.getElementById('app');let current='home',surahs=[],tas=0,hadithPage=1,hadithBook='bukhari';
const duas=[
['سونے سے پہلے','بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا','اے اللہ! تیرے نام کے ساتھ میں مرتا اور جیتا ہوں۔','صحیح بخاری 6324'],
['جاگنے کے بعد','الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ','تمام تعریف اللہ کے لیے ہے جس نے ہمیں موت کے بعد زندگی دی اور اسی کی طرف اٹھ کر جانا ہے۔','صحیح بخاری 6312'],
['کھانا شروع کرنے سے پہلے','بِسْمِ اللَّهِ','اللہ کے نام سے شروع کرتا ہوں۔','صحیح بخاری 5376'],
['کھانے کے بعد','الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ','تمام تعریف اللہ کے لیے جس نے مجھے یہ کھلایا اور میری طاقت کے بغیر رزق دیا۔','ترمذی 3458'],
['گھر سے نکلتے وقت','بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','اللہ کے نام سے، میں نے اللہ پر بھروسہ کیا، نیکی کی طاقت اور برائی سے بچنے کی قوت اللہ ہی سے ہے۔','ابو داؤد 5095'],
['گھر میں داخل ہوتے وقت','بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا','اللہ کے نام سے ہم داخل ہوئے، اللہ کے نام سے نکلے اور اپنے رب پر بھروسہ کیا۔','ابو داؤد 5096'],
['مسجد میں داخل ہوتے وقت','اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ','اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔','صحیح مسلم 713'],
['مسجد سے نکلتے وقت','اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ','اے اللہ! میں تجھ سے تیرا فضل مانگتا ہوں۔','صحیح مسلم 713'],
['والدین کے لیے','رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا','اے میرے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں مجھے پالا۔','سورۃ الاسراء 17:24'],
['علم میں اضافے کے لیے','رَبِّ زِدْنِي عِلْمًا','اے میرے رب! میرے علم میں اضافہ فرما۔','سورۃ طٰہٰ 20:114'],
['دنیا و آخرت کی بھلائی','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','اے ہمارے رب! ہمیں دنیا اور آخرت میں بھلائی عطا فرما اور آگ کے عذاب سے بچا۔','سورۃ البقرۃ 2:201'],
['پریشانی کے وقت','حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ','ہمیں اللہ کافی ہے اور وہ بہترین کارساز ہے۔','سورۃ آل عمران 3:173'],
['استغفار','أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ','میں اللہ سے بخشش مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔','صحیح بخاری 6307'],
['درود شریف','اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ','اے اللہ! محمد ﷺ اور آل محمد پر رحمت نازل فرما۔','صحیح بخاری 3370'],
['سفر کی دعا','سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ','پاک ہے وہ ذات جس نے اسے ہمارے تابع کیا، ورنہ ہم اسے قابو میں نہ کر سکتے تھے۔','سورۃ الزخرف 43:13'],
['بارش کے وقت','اللَّهُمَّ صَيِّبًا نَافِعًا','اے اللہ! اسے نفع دینے والی بارش بنا۔','صحیح بخاری 1032'],
['چھینک کے بعد','الْحَمْدُ لِلَّهِ','تمام تعریف اللہ کے لیے ہے۔','صحیح بخاری 6224'],
['غصے کے وقت','أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ','میں شیطان مردود سے اللہ کی پناہ مانگتا ہوں۔','صحیح بخاری 3282'],
['مصیبت کے وقت','إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ','ہم اللہ ہی کے ہیں اور اسی کی طرف لوٹ کر جانے والے ہیں۔','سورۃ البقرۃ 2:156'],
['افطار کے وقت','ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ','پیاس بجھ گئی، رگیں تر ہوگئیں اور ان شاء اللہ اجر ثابت ہوگیا۔','ابو داؤد 2357']
];
let reminderIndex=0;function drawReminder(){let box=document.getElementById('reminderContent');if(!box)return;let d=duas[reminderIndex];box.innerHTML='<div class="arabic">'+d[1]+'</div><p class="translation center">'+(language==='en'?d[4]:d[2])+'</p><div class="meta center">'+d[0]+' • '+d[3]+'</div>'}function refreshReminder(){reminderIndex=(reminderIndex+1)%duas.length;drawReminder()}
function go(p){current=p;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function home(){if(language==='en')return `<section class="hero"><div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><p>In the name of Allah, the Most Compassionate, the Most Merciful</p><div class="date">Hearts find peace in the remembrance of Allah</div></section><section class="section"><h2>Peace be upon you</h2><p class="translation">Welcome to Noor Ul Huda. The Holy Quran, selected Hadith, daily duas and useful worship tools in one place.</p><div class="row"><input class="field" id="username" placeholder="Enter your name" maxlength="32"><button class="btn" onclick="saveName()">Save</button></div><small class="muted" id="greet"></small></section><div class="grid"><button class="tile" onclick="go('quran')"><div class="ico">۞</div><b>The Holy Quran</b><small>114 Surahs, translation</small></button><button class="tile" onclick="go('hadith')"><div class="ico">✧</div><b>Prophetic Hadith</b><small>Selected narrations</small></button><button class="tile" onclick="go('dua')"><div class="ico">🤲</div><b>Daily Duas</b><small>Supplications</small></button><button class="tile" onclick="go(\\'tools\\')"><div class="ico">◉</div><b>Dhikr & Tools</b><small>Tasbeeh and prayer times</small></button><button class="tile" data-page="weather" onclick="go(this.dataset.page)"><div class="ico">🌤</div><b>Weather</b><small>Choose a city</small></button></div><section class="section"><h2>Reminder</h2><div id="reminderContent"></div><button class="btn primary" onclick="refreshReminder()">↻ Refresh reminder</button></section>`;return `<section class="hero"><div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><p>اللہ کے نام سے جو نہایت مہربان، رحم فرمانے والا ہے</p><div class="date" id="hijri">اللہ کے ذکر سے دلوں کو سکون ملتا ہے</div></section><section class="section"><h2>السلام علیکم ورحمة اللہ</h2><p class="translation">نور الہدیٰ میں خوش آمدید۔ قرآنِ کریم، مستند احادیث، روزمرہ مسنون دعائیں اور عبادت کے مفید ٹولز ایک جگہ۔</p><div class="row"><input class="field" id="username" placeholder="اپنا نام لکھیں" maxlength="32"><button class="btn" onclick="saveName()">محفوظ</button></div><small class="muted" id="greet"></small></section><div class="grid"><button class="tile" onclick="go('quran')"><div class="ico">۞</div><b>قرآنِ کریم</b><small>114 سورتیں، ترجمہ</small></button><button class="tile" onclick="go('hadith')"><div class="ico">✧</div><b>احادیثِ نبوی ﷺ</b><small>حدیث کی کتب</small></button><button class="tile" onclick="go('dua')"><div class="ico">🤲</div><b>مسنون دعائیں</b><small>روزمرہ کی دعائیں</small></button><button class="tile" onclick="go(\'tools\')"><div class="ico">◉</div><b>اذکار و ٹولز</b><small>تسبیح، نماز کے اوقات</small></button><button class="tile" data-page="weather" onclick="go(this.dataset.page)"><div class="ico">🌤</div><b>موسم</b><small>شہر منتخب کریں</small></button></div><section class="section"><h2>آج کی یاد دہانی</h2><div id="reminderContent"></div><button class="btn primary" onclick="refreshReminder()">↻ یاد دہانی تبدیل کریں</button></section>`}
function render(){if(current==='home'){app.innerHTML=home();let n=localStorage.getItem('noorName');if(n){document.getElementById('greet').textContent='خوش آمدید، '+n;document.getElementById('username').value=n}drawReminder();return}if(current==='quran'){quranPage();return}if(current==='hadith'){hadithPageView();return}if(current==='dua'){app.innerHTML=language==='en'?'<section class="section"><h2>Daily Duas</h2><p class="muted">Arabic text, English translation and reference</p><input class="field" id="duasearch" placeholder="Search duas"><div id="dualist"></div></section>':'<section class="section"><h2>مسنون دعائیں</h2><p class="muted">عربی متن، اردو ترجمہ اور حوالہ</p><input class="field" id="duasearch" placeholder="دعا تلاش کریں"><div id="dualist"></div></section>';drawDuas();document.getElementById('duasearch').oninput=drawDuas;return}if(current==='tools'){toolsPage();return}if(current==='history'){historyPage();return}if(current==='prophets'){prophetHistoryPage();return}if(current==='photoGallery'){photoGalleryPage();return}if(current==='weather'){weatherPage();return}if(current==='azan'){azanPage();return}}

const prophets=[
['آدم علیہ السلام','Prophet Adam','اللہ تعالیٰ نے آدم علیہ السلام کو پیدا فرمایا اور انہیں علم عطا کیا۔ وہ پہلے انسان اور پہلے نبی تھے۔ قرآن میں ان کی تخلیق، فرشتوں کے سجدے اور توبہ کا ذکر ہے۔','Allah created Adam and taught him. He was the first human and a prophet. The Quran describes his creation, the angels’ prostration, and his repentance.'],
['ادریس علیہ السلام','Prophet Idris','قرآن میں ادریس علیہ السلام کو سچا نبی اور بلند مرتبے والا قرار دیا گیا ہے۔ ان کے بارے میں تفصیلات محدود ہیں، اس لیے غیر ثابت قصوں سے گریز کیا گیا ہے۔','The Quran describes Idris as a truthful prophet of a high station. Details are limited in the Quran, so later unverified stories are avoided.'],
['نوح علیہ السلام','Prophet Nuh','نوح علیہ السلام نے اپنی قوم کو طویل عرصے تک ایک اللہ کی عبادت کی دعوت دی۔ قوم کے انکار کے بعد اللہ کے حکم سے کشتی بنی اور ایمان والوں کو نجات ملی۔','Nuh called his people to worship Allah alone for a long time. After their rejection, the Ark was built by Allah’s command and the believers were saved.'],
['ہود علیہ السلام','Prophet Hud','ہود علیہ السلام قومِ عاد کی طرف بھیجے گئے۔ انہوں نے اپنی قوم کو تکبر چھوڑ کر اللہ کی عبادت کی دعوت دی، مگر انکار کرنے والوں پر سخت آندھی کا عذاب آیا۔','Hud was sent to the people of ‘Ad. He called them away from arrogance and toward worship of Allah; a fierce wind punished those who rejected the message.'],
['صالح علیہ السلام','Prophet Salih','صالح علیہ السلام قومِ ثمود کی طرف بھیجے گئے۔ اللہ نے اونٹنی کو نشانی بنایا، مگر قوم کے سرکش لوگوں نے اسے نقصان پہنچایا اور نافرمانی پر عذاب آیا۔','Salih was sent to Thamud. The she-camel was given as a sign, but rebellious people harmed it and punishment followed their disobedience.'],
['ابراہیم علیہ السلام','Prophet Ibrahim','ابراہیم علیہ السلام نے بت پرستی کے خلاف توحید کی دعوت دی۔ انہیں آگ میں ڈالا گیا تو اللہ نے آگ کو ٹھنڈا اور سلامتی والا بنا دیا۔ وہ خلیل اللہ کہلائے۔','Ibrahim called people to worship Allah alone and challenged idol worship. When he was cast into the fire, Allah made it cool and safe. He is known as the close friend of Allah.'],
['لوط علیہ السلام','Prophet Lut','لوط علیہ السلام نے اپنی قوم کو بے حیائی اور برے اعمال سے روکا اور پاکیزگی کی دعوت دی۔ قوم نے انکار کیا تو اللہ نے انہیں عذاب سے بچا لیا۔','Lut warned his people against grave wrongdoing and called them to purity. When they rejected him, Allah rescued him from the punishment.'],
['اسماعیل علیہ السلام','Prophet Ismail','اسماعیل علیہ السلام صبر اور وعدے کی پابندی کی مثال تھے۔ ابراہیم علیہ السلام کے ساتھ خانہ کعبہ کی بنیادیں بلند کرنے میں شریک ہوئے۔','Ismail is described as patient and true to his promise. He helped Ibrahim raise the foundations of the Kaaba.'],
['اسحاق علیہ السلام','Prophet Ishaq','اسحاق علیہ السلام ابراہیم علیہ السلام کو اللہ کی عطا کردہ بشارت تھے۔ اللہ نے انہیں نیک اور برگزیدہ بندوں میں شامل فرمایا۔','Ishaq was glad tidings granted to Ibrahim. Allah counted him among the righteous and chosen servants.'],
['یعقوب علیہ السلام','Prophet Yaqub','یعقوب علیہ السلام صبر کرنے والے نبی تھے۔ اپنے بیٹے یوسف علیہ السلام کی جدائی میں غم برداشت کیا اور اللہ کی رحمت سے کبھی مایوس نہ ہوئے۔','Yaqub was a patient prophet. He endured the grief of separation from Yusuf and never despaired of Allah’s mercy.'],
['یوسف علیہ السلام','Prophet Yusuf','یوسف علیہ السلام کو آزمائشوں کا سامنا کرنا پڑا، مگر انہوں نے پاک دامنی، صبر اور معافی کا راستہ اختیار کیا۔ آخرکار اللہ نے انہیں عزت اور اقتدار عطا فرمایا۔','Yusuf faced many trials but remained chaste, patient, and forgiving. Allah eventually granted him honor and authority.'],
['ایوب علیہ السلام','Prophet Ayyub','ایوب علیہ السلام بیماری اور مشکلات میں صبر کی عظیم مثال ہیں۔ انہوں نے اللہ سے دعا کی اور اللہ نے ان کی تکلیف دور فرمائی۔','Ayyub is an example of patience through illness and hardship. He prayed to Allah, who removed his suffering.'],
['شعیب علیہ السلام','Prophet Shuayb','شعیب علیہ السلام نے اہلِ مدین کو ناپ تول میں کمی اور دھوکے سے منع کیا اور انصاف و توحید کی دعوت دی۔','Shuayb warned the people of Madyan against cheating in weights and measures and called them to justice and worship of Allah.'],
['موسیٰ علیہ السلام','Prophet Musa','موسیٰ علیہ السلام کو فرعون کے مقابل بھیجا گیا۔ اللہ نے انہیں معجزات عطا کیے، بنی اسرائیل کو نجات دی اور تورات عطا فرمائی۔','Musa was sent to confront Pharaoh. Allah gave him signs, rescued the Children of Israel, and revealed the Torah to him.'],
['ہارون علیہ السلام','Prophet Harun','ہارون علیہ السلام موسیٰ علیہ السلام کے بھائی اور مددگار نبی تھے۔ انہوں نے بنی اسرائیل کو اللہ کی عبادت کی طرف بلایا۔','Harun was the brother and prophetic helper of Musa. He called the Children of Israel to worship Allah.'],
['ذوالکفل علیہ السلام','Prophet Dhul-Kifl','قرآن میں ذوالکفل علیہ السلام کا ذکر صبر کرنے والے نیک بندوں میں آیا ہے۔ ان کے حالات کی تفصیل قرآن میں بیان نہیں ہوئی۔','Dhul-Kifl is mentioned in the Quran among the patient and righteous. The Quran does not provide detailed biographical information.'],
['داؤد علیہ السلام','Prophet Dawud','داؤد علیہ السلام کو نبوت اور بادشاہت عطا ہوئی۔ اللہ نے انہیں زبور دی اور لوہے کو ان کے لیے نرم کر دیا۔ وہ عدل و عبادت کے لیے معروف تھے۔','Dawud was granted prophethood and kingship. Allah revealed the Zabur to him and made iron pliable for him. He was known for justice and worship.'],
['سلیمان علیہ السلام','Prophet Sulayman','سلیمان علیہ السلام کو عظیم سلطنت اور خاص نعمتیں عطا ہوئیں۔ انہوں نے ہر نعمت کو اللہ کا فضل سمجھا اور شکر ادا کیا۔','Sulayman was granted a great kingdom and extraordinary blessings. He recognized every blessing as Allah’s favor and gave thanks.'],
['الیاس علیہ السلام','Prophet Ilyas','الیاس علیہ السلام نے اپنی قوم کو بت بعل کی عبادت چھوڑ کر اللہ کی عبادت کی دعوت دی۔','Ilyas called his people to abandon the worship of Baal and worship Allah alone.'],
['الیسع علیہ السلام','Prophet Al-Yasa','الیسع علیہ السلام قرآن میں برگزیدہ اور نیک انبیاء میں شمار کیے گئے ہیں۔ قرآن ان کے حالات کی تفصیل بیان نہیں کرتا۔','Al-Yasa is counted among the chosen and righteous prophets in the Quran. The Quran gives few biographical details about him.'],
['یونس علیہ السلام','Prophet Yunus','یونس علیہ السلام مچھلی کے پیٹ میں آزمائش سے گزرے۔ انہوں نے اخلاص سے دعا کی تو اللہ نے انہیں نجات عطا فرمائی۔','Yunus was tested inside the great fish. He called upon Allah sincerely, and Allah rescued him.'],
['زکریا علیہ السلام','Prophet Zakariya','زکریا علیہ السلام نے بڑھاپے میں اللہ سے نیک اولاد کی دعا کی۔ اللہ نے انہیں یحییٰ علیہ السلام کی بشارت عطا فرمائی۔','Zakariya prayed for a righteous child in old age. Allah gave him the glad tidings of Yahya.'],
['یحییٰ علیہ السلام','Prophet Yahya','یحییٰ علیہ السلام کو بچپن ہی سے حکمت عطا ہوئی۔ قرآن انہیں پاکیزہ، نرم دل اور اپنے والدین کے ساتھ نیک بیان کرتا ہے۔','Yahya was granted wisdom from childhood. The Quran describes him as pure, compassionate, and dutiful to his parents.'],
['عیسیٰ علیہ السلام','Prophet Isa','عیسیٰ علیہ السلام کی پیدائش معجزانہ طور پر حضرت مریمؑ کے ہاں ہوئی۔ اللہ کے حکم سے انہوں نے معجزات دکھائے اور انجیل عطا کی گئی۔','Isa was miraculously born to Maryam. By Allah’s permission he performed miracles, and he was given the Gospel.'],
['محمد ﷺ','Prophet Muhammad ﷺ','محمد ﷺ اللہ کے آخری نبی اور رسول ہیں۔ آپ پر قرآن نازل ہوا۔ آپ کی سیرت رحمت، عدل، صبر اور بہترین اخلاق کا کامل نمونہ ہے۔','Muhammad ﷺ is the final prophet and messenger of Allah. The Quran was revealed to him. His life is an example of mercy, justice, patience, and excellent character.']
];
function historyPage(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'Explore Islamic History':'اسلامی تاریخ اور مقدس مقامات')+'</h2><p class="muted">'+(en?'Choose a section':'اپنی پسند کا حصہ منتخب کریں')+'</p><div class="grid"><button class="tile" data-page="photoGallery" onclick="go(this.dataset.page)"><div class="ico">🕋</div><b>'+(en?'Makkah & Madinah Photos':'مکہ، مدینہ اور زیارات کی تصاویر')+'</b><small>'+(en?'Up to 10 recent photos in each section':'ہر حصے میں 10 تازہ تصاویر تک')+'</small></button><button class="tile" data-page="prophets" onclick="go(this.dataset.page)"><div class="ico">📜</div><b>'+(en?'Stories of the Prophets':'انبیاء کرام کی تاریخ')+'</b><small>'+(en?'The 25 prophets named in the Quran':'قرآن میں مذکور 25 انبیاء کے حالات')+'</small></button></div></section>'}
function prophetHistoryPage(){let en=language==='en';app.innerHTML='<button class="btn back" data-page="history" onclick="go(this.dataset.page)">← '+(en?'Back':'واپس')+'</button><section class="section"><h2>'+(en?'Stories of the Prophets':'انبیاء کرام علیہم السلام کے واقعات')+'</h2><p class="muted">'+(en?'The 25 prophets named in the Quran. Read in English.':'قرآنِ کریم میں نام سے مذکور 25 انبیاء کے مختصر حالات۔ اردو میں مطالعہ کریں۔')+'</p><input class="field" id="prophetSearch" placeholder="'+(en?'Search a prophet':'نبی کا نام تلاش کریں')+'"><div id="prophetList"></div><p class="meta">'+(en?'These summaries prioritize Quranic information; details not established in the Quran are not presented as fact.':'یہ خلاصے بنیادی طور پر قرآنی معلومات پر مشتمل ہیں؛ غیر ثابت روایات کو یقینی حقیقت کے طور پر شامل نہیں کیا گیا۔')+'</p></section>';drawProphets();document.getElementById('prophetSearch').oninput=drawProphets}

function drawProphets(){let en=language==='en',q=(document.getElementById('prophetSearch')?.value||'').toLowerCase(),box=document.getElementById('prophetList');if(!box)return;box.innerHTML=prophets.filter(p=>p.join(' ').toLowerCase().includes(q)).map((p,i)=>'<article class="history-item"><b>'+(i+1)+'. '+(en?p[1]:p[0])+'</b><p>'+(en?p[3]:p[2])+'</p></article>').join('')}


function photoGalleryPage(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'Makkah, Madinah & Ziyarat Photos':'مکہ، مدینہ اور زیارات کی تصاویر')+'</h2><div class="gallery-tabs"><button class="btn" onclick="loadPhotoGallery(0)">'+(en?'Makkah':'مکہ')+'</button><button class="btn" onclick="loadPhotoGallery(1)">'+(en?'Madinah':'مدینہ')+'</button><button class="btn" onclick="loadPhotoGallery(2)">'+(en?'Ziyarat':'زیارات')+'</button></div><div id="galleryStatus" class="muted center"></div><div id="galleryGrid" class="gallery-grid"></div></section>';loadPhotoGallery(0)}
async function loadPhotoGallery(kind){let st=document.getElementById('galleryStatus'),grid=document.getElementById('galleryGrid');if(!st||!grid)return;st.textContent=language==='en'?'Loading photos…':'تصاویر لوڈ ہو رہی ہیں…';grid.innerHTML='';let qs=['"Masjid al-Haram" OR Kaaba Makkah','"Al-Masjid an-Nabawi" OR "Prophet Mosque" Madinah','"Quba Mosque" OR "Mount Uhud" OR "Qiblatain Mosque" OR "Jannat al-Baqi"'];try{let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+qs[kind])+'&gsrnamespace=6&gsrlimit=10&gsrsort=create_timestamp_desc&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*';let r=await fetch(u),j=await r.json(),arr=Object.values(j.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl&&p.imageinfo[0].url).slice(0,10);if(!arr.length)throw Error('empty');st.textContent=arr.length+' '+(language==='en'?'photos':'تصاویر');grid.innerHTML=arr.map(p=>'<div class="gallery-card"><img src="'+p.imageinfo[0].thumburl+'" loading="lazy" onclick="openGalleryPhoto(this.dataset.full)" data-full="'+p.imageinfo[0].url+'"><div class="gallery-caption">'+p.title.replace(/^File:/,'')+'</div></div>').join('')}catch(e){st.textContent=language==='en'?'Photos could not load. Try again later.':'تصاویر لوڈ نہیں ہو سکیں، دوبارہ کوشش کریں۔'}}
function openGalleryPhoto(url){let old=document.getElementById('photoViewer');if(old)old.remove();document.body.insertAdjacentHTML('beforeend','<div class="photo-modal" id="photoViewer"><div class="photo-modal-inner"><button class="btn" onclick="closePhotoViewer()">✕</button><img src="'+url+'"><a class="btn primary download-link" href="'+url+'" download>⬇ Download photo</a></div></div>')}
function closePhotoViewer(){let x=document.getElementById('photoViewer');if(x)x.remove()}
function weatherPage(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'Weather':'موسم')+'</h2><p class="muted">'+(en?'Enter a city. No location access needed.':'شہر کا نام درج کریں، لوکیشن کی اجازت درکار نہیں۔')+'</p><input class="field" id="weatherCity" value="Jeddah"><button class="btn primary" onclick="loadWeather()">'+(en?'Show weather':'موسم معلوم کریں')+'</button><div id="weatherResult" class="translation"></div></section>';loadWeather()}
async function loadWeather(){let c=document.getElementById('weatherCity')?.value||'Jeddah',b=document.getElementById('weatherResult');if(!b)return;b.textContent='Loading…';try{let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(c)+'&count=1&format=json'),p=(await g.json()).results?.[0];if(!p)throw Error();let w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,apparent_temperature,relative_humidity_2m&timezone=auto'),d=(await w.json()).current;b.innerHTML='<h2>'+p.name+'</h2><div class="counter">'+Math.round(d.temperature_2m)+'°C</div><p>Feels like '+Math.round(d.apparent_temperature)+'°C • Humidity '+d.relative_humidity_2m+'%</p>'}catch(e){b.textContent='Weather unavailable. Check city and internet.'}}
function azanPage(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'Azan notification tone':'اذان نوٹیفکیشن ٹون')+'</h2><p class="muted">'+(en?'Choose your city. No location permission needed.':'شہر منتخب کریں۔ لوکیشن اجازت کی ضرورت نہیں۔')+'</p><input class="field" id="city" value="Jeddah"><button class="btn primary" onclick="togglePrayerAlerts()">'+(localStorage.getItem('noorPrayerAlerts')==='on'?'Turn alerts off':'Turn alerts on')+'</button><p class="meta">'+(localStorage.getItem('noorPrayerAlerts')==='on'?'Alerts enabled':'Alerts off')+'</p></section>'}

function saveName(){let n=document.getElementById('username').value.trim();if(n){localStorage.setItem('noorName',n);document.getElementById('greet').textContent='خوش آمدید، '+n}}
let quranMode='arabic',audioSurah=1,audioAyah=1,audioTotal=7,quranAudio=null;
async function loadSurahs(){if(surahs.length)return surahs;let r=await fetch('https://api.alquran.cloud/v1/surah');let d=await r.json();surahs=d.data;return surahs}
async function quranPage(){let en=language==='en';app.innerHTML='<section class="section"><h2>'+(en?'The Holy Quran':'قرآنِ کریم')+'</h2><p class="muted">'+(en?'Choose how you want to read or listen':'قرآن پڑھنے یا سننے کا طریقہ منتخب کریں')+'</p><div class="grid"><button class="tile" onclick="openQuranMode(\'arabic\')"><div class="ico">۞</div><b>'+(en?'Arabic Quran':'صرف قرآن')+'</b><small>'+(en?'Arabic text only':'صرف عربی متن')+'</small></button><button class="tile" onclick="openQuranMode(\'urdu\')"><div class="ico">ترجمہ</div><b>'+(en?'Arabic + Urdu':'قرآن مع اردو ترجمہ')+'</b><small>'+(en?'Arabic with Urdu translation':'ہر آیت کے نیچے اردو ترجمہ')+'</small></button><button class="tile" onclick="audioQuranPage()"><div class="ico">♫</div><b>'+(en?'Audio Quran':'آڈیو قرآن')+'</b><small>'+(en?'Mishary Alafasy recitation':'مشاری العفاسی کی تلاوت')+'</small></button></div><div id="surahbrowser"></div></section>'; }
async function openQuranMode(mode){quranMode=mode;let en=language==='en';let box=document.getElementById('surahbrowser');if(!box)return;box.innerHTML='<input class="field" id="surahsearch" placeholder="'+(en?'Search Surah':'سورت تلاش کریں')+'"><div id="surahlist" class="muted">'+(en?'Loading…':'فہرست لوڈ ہو رہی ہے…')+'</div>';try{await loadSurahs();drawSurahs();document.getElementById('surahsearch').oninput=drawSurahs}catch(e){document.getElementById('surahlist').textContent=en?'Could not load Surahs. Check internet.':'سورتوں کی فہرست لوڈ نہیں ہو سکی۔'}} 
function drawSurahs(){let q=(document.getElementById('surahsearch')?.value||'').toLowerCase();let box=document.getElementById('surahlist');if(!box)return;box.innerHTML=surahs.filter(s=>(s.number+' '+s.name+' '+s.englishName).toLowerCase().includes(q)).map(s=>'<div class="listitem" onclick="readSurah('+s.number+')"><b>'+s.number+'. '+s.name+'</b><div class="meta">'+s.englishName+' • '+s.numberOfAyahs+' آیات • '+(s.revelationType==='Meccan'?'مکی':'مدنی')+'</div></div>').join('')}
async function readSurah(n){let mode=quranMode;app.innerHTML='<section class="section"><button class="btn back" onclick="quranPage()">← قرآن کے اختیارات</button><div class="center muted">آیات لوڈ ہو رہی ہیں…</div></section>';try{let editions=mode==='urdu'?'quran-uthmani,ur.jalandhry':'quran-uthmani';let r=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/editions/'+editions);let d=await r.json(),ar=d.data[0],ur=mode==='urdu'?d.data[1]:null;let bism=(n!==1&&n!==9)?'<div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'';app.innerHTML='<section class="section"><button class="btn back" onclick="quranPage()">← قرآن کے اختیارات</button><div class="surahhead"><h2>'+ar.name+'</h2><div class="meta">'+ar.englishName+' • '+ar.numberOfAyahs+' آیات</div></div>'+bism+ar.ayahs.map((a,i)=>'<div class="ayah"><div class="arabic">'+a.text+' <span class="ayahnum">'+a.numberInSurah+'</span></div>'+(ur?'<div class="translation">'+ur.ayahs[i].text+'</div>':'')+'</div>').join('')+'</section>'}catch(e){app.innerHTML='<section class="section">آیات لوڈ نہیں ہو سکیں۔ انٹرنیٹ چیک کریں۔</section>'}}

async function playAudioSurah(n){let s=surahs.find(x=>x.number===n);if(!s){await loadSurahs();s=surahs.find(x=>x.number===n)}audioSurah=n;audioAyah=1;audioTotal=s.numberOfAyahs;document.getElementById('audioPlayer').classList.remove('hidden');document.getElementById('audioTitle').textContent=s.name+' — '+s.englishName;let el=document.getElementById('quranAudioElement');if(quranAudio)quranAudio.pause();quranAudio=el;el.onended=()=>{document.getElementById('audioStatus').textContent='سورت مکمل ہو گئی';};setAudioTrack()}

function qibla(){let lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){document.getElementById('qiblaout').textContent='درست نقاط درج کریں';return}let r=Math.PI/180,p1=lat*r,p2=21.4225*r,dl=(39.8262-lon)*r,y=Math.sin(dl),x=Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl),deg=(Math.atan2(y,x)/r+360)%360;document.getElementById('qiblaout').textContent=language==='en'?'Qibla: '+deg.toFixed(1)+'° clockwise from North':'قبلہ: '+deg.toFixed(1)+'° شمال سے گھڑی کی سمت'}

function chooseLanguage(code){language=code;document.documentElement.lang=code;document.documentElement.dir=code==='ur'?'rtl':'ltr';document.getElementById('nav').style.display='flex';document.getElementById('nav').innerHTML=code==='ur'?'<button data-page="home" class="active"><span>⌂</span>ہوم</button><button data-page="quran"><span>۞</span>قرآن</button><button data-page="hadith"><span>✧</span>حدیث</button><button data-page="dua"><span>🤲</span>دعائیں</button><button data-page="tools"><span>◉</span>اذکار</button><button data-page="history"><span>⌁</span>تاریخ</button>':'<button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="quran"><span>۞</span>Quran</button><button data-page="hadith"><span>✧</span>Hadith</button><button data-page="dua"><span>🤲</span>Duas</button><button data-page="tools"><span>◉</span>Dhikr</button><button data-page="history"><span>⌁</span>History</button>';document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home')}
function languagePage(){document.getElementById('nav').style.display='none';app.innerHTML='<section class="langcard"><div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><h2 style="color:var(--gold)">Choose Your Language / زبان منتخب کریں</h2><p class="muted">Select the translation language for Quran, Hadith and Duas</p><button class="btn primary" onclick="chooseLanguage(\'ur\')">العربية + اردو</button><button class="btn primary" onclick="chooseLanguage(\'en\')">English + العربية</button></section>'}
setTimeout(()=>{let splash=document.getElementById('splash');splash.style.opacity='0';setTimeout(()=>{splash.remove();languagePage()},550)},1700);
</script></body></html>
