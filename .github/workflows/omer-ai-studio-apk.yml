name: OMER AI Studio Android APK

on:
  push:
    branches: [omer-ai-design-app]
    paths:
      - 'OMER-AI-Design-App/**'
      - '.github/workflows/omer-ai-studio-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI Studio debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OMER-AI-Design-App
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMER-AI-Studio-debug-APK
          path: OMER-AI-Design-App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
