name: Build Earth Vision 3D APK

on:
  push:
    branches: [earth-vision-3d]
    paths:
      - 'EarthVision3D/**'
      - '.github/workflows/earth-vision-3d-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EarthVision3D
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Earth-Vision-3D-debug-APK
          path: EarthVision3D/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
